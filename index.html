<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ceremony Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room shell. Step rail on the left, live budget / CO2 readouts in the top bar, work surface on the right. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F4F5F9; --ink:#141829; --muted:#5A6079; --line:#D5D9E3;
  --tally:#D23B25; --tally-ink:#FFFFFF; --tally-soft:#FBE4DF;
  --ok:#1C7F4D; --ok-soft:#DCF0E4; --warn:#9C6512; --warn-soft:#F8EDD5; --bad:#BF3328; --bad-soft:#F9DFDB;
  --bar:#3A4166; --bar-soft:#DDE0EA;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F1D; --surface:#141830; --surface-2:#1A1F3B; --ink:#E8EAF4; --muted:#9BA1BE; --line:#2A3056;
  --tally:#FF6247; --tally-ink:#1B0906; --tally-soft:#3A1A16;
  --ok:#43C685; --ok-soft:#10301F; --warn:#E5A942; --warn-soft:#33270F; --bad:#FF6F62; --bad-soft:#3A1714;
  --bar:#8F97C9; --bar-soft:#262C4E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C0F1D; --surface:#141830; --surface-2:#1A1F3B; --ink:#E8EAF4; --muted:#9BA1BE; --line:#2A3056;
  --tally:#FF6247; --tally-ink:#1B0906; --tally-soft:#3A1A16;
  --ok:#43C685; --ok-soft:#10301F; --warn:#E5A942; --warn-soft:#33270F; --bad:#FF6F62; --bad-soft:#3A1714;
  --bar:#8F97C9; --bar-soft:#262C4E; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--tally);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.tally-dot{width:10px;height:10px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 3px var(--tally-soft)}
.plan-name{flex:1 1 220px;min-width:0;display:flex;flex-direction:column}
.plan-name input{border:0;background:transparent;font-weight:600;font-size:16px;padding:2px 0;min-width:0;width:100%}
.plan-name input:hover{background:var(--surface-2)}
.plan-name small{font-size:12px;color:var(--muted)}
.readouts{display:flex;gap:10px;flex-wrap:wrap}
.readout{display:flex;flex-direction:column;padding:4px 12px;border-radius:8px;background:var(--surface-2);min-width:120px}
.readout .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.readout .v{font-family:var(--font-mono);font-size:14px;font-weight:500;white-space:nowrap}
.readout.over{background:var(--bad-soft)} .readout.over .v{color:var(--bad)}
.readout.under{background:var(--ok-soft)} .readout.under .v{color:var(--ok)}
.top-actions{display:flex;gap:8px}

.steps{padding:18px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto}
.step{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;padding:9px 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.step:hover{background:var(--surface);color:var(--ink)}
.step .n{font-family:var(--font-mono);font-size:12px}
.step.on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--tally)}
.step .st{font-size:11px;font-family:var(--font-mono);padding:1px 6px;border-radius:99px}
.st.done{color:var(--ok);background:var(--ok-soft)} .st.over{color:var(--bad);background:var(--bad-soft)} .st.todo{color:var(--muted)}
main{padding:28px clamp(16px,3vw,40px) 120px;min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .steps{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);position:static;max-height:none;padding:8px 12px;background:var(--bg)}
  .step{grid-template-columns:auto auto;white-space:nowrap}
  .step .st{display:none}
  .step.on{box-shadow:inset 0 -3px 0 var(--tally)}
  .readout{min-width:0}
}

/* Headings */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4vw,44px);line-height:1;text-transform:uppercase;letter-spacing:.01em}
.head p{max-width:62ch;color:var(--muted);margin-top:8px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--tally);border-color:var(--tally);color:var(--tally-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .spark{font-family:var(--font-mono);font-size:12px;opacity:.85}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink)}

/* Panels & cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel > h2{margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.list{display:flex;flex-direction:column;gap:12px}
.item h3{margin-bottom:3px}
.item p{color:var(--muted);font-size:14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner b{color:var(--warn)}
.empty{padding:40px 24px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{max-width:52ch;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* Forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0;width:100%}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--tally);outline:none;background:var(--surface)}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px 22px}
.slider{display:flex;flex-direction:column;gap:6px}
.slider .row{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500}
.slider input{accent-color:var(--tally);width:100%}
.templates{display:flex;gap:8px;flex-wrap:wrap}

/* Research */
.refs{display:flex;flex-direction:column}
.ref{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.ref:first-child{border-top:0;padding-top:0}
.ref .ev{font-weight:600}
.ref .yr{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.ref .tk{font-size:14px}
.ref .tk b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
@media (max-width:760px){.ref{grid-template-columns:1fr;gap:6px}}
.watch li{margin-bottom:6px}
.watch{margin:0;padding-left:18px}

/* Concepts */
.concept{display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.concept.on{border-color:var(--tally);box-shadow:0 0 0 1px var(--tally)}
.concept h3{font-family:var(--font-display);font-size:26px;font-weight:800;text-transform:uppercase;line-height:1}
.concept .log{font-weight:500}
.concept dl{margin:0;display:grid;gap:8px;font-size:14px}
.concept dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.concept dd{margin:0}
.actbar{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px}
.actbar span{background:var(--bar-soft);font-size:11px;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.concept.on .actbar span:nth-child(odd){background:var(--tally-soft)}

/* Run of show */
.ros{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.ros .act{flex:1 1 0;min-width:140px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.ros .tc{font-family:var(--font-mono);font-size:12px;color:var(--tally)}
.ros .an{font-weight:600;margin-top:2px}
.ros .ad{font-size:12.5px;color:var(--muted);margin-top:4px}

/* Elements */
.act-group{display:flex;flex-direction:column;gap:12px}
.act-group > .gh{display:flex;align-items:baseline;gap:10px}
.act-group > .gh h2{font-family:var(--font-display);font-size:22px;font-weight:800;text-transform:uppercase}
.els{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.el{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.el.off{opacity:.55;border-style:dashed}
.el .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.el h3{font-size:16px}
.el .desc{font-size:13.5px;color:var(--muted)}
.el .tools{display:flex;gap:4px;flex-shrink:0}
.icon{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted)}
.icon:hover{color:var(--ink);border-color:var(--muted)}
.icon.on{color:var(--tally);border-color:var(--tally);background:var(--tally-soft)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface-2);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.seg button:first-child{border-left:0}
.seg button span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg button b{font-family:var(--font-mono);font-weight:500;font-size:13px}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg button.on span{color:inherit;opacity:.8}
.tierdesc{font-size:13.5px;padding:8px 10px;border-radius:7px;background:var(--surface-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--ink)}
.score{display:inline-flex;align-items:center;gap:5px}

/* Budget */
.bigbar{position:relative;height:30px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:visible}
.bigbar .fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--bar)}
.bigbar .fill.oh{background:color-mix(in srgb,var(--bar) 55%,var(--surface-2))}
.bigbar .cap{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--tally)}
.bigbar .cap span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-family:var(--font-mono);color:var(--tally);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.1}
.stat .v.bad{color:var(--bad)} .stat .v.ok{color:var(--ok)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:13.5px}
.hbar .t{height:12px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--bar);border-radius:4px}
.hbar .t i.g{background:var(--ok)}
.hbar .t i.r{background:var(--tally)}
.hbar .n{text-align:right;font-family:var(--font-mono);font-size:12.5px}
.hbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.scen div{padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.scen div.cur{background:var(--ink);color:var(--surface)}
.scen span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;font-weight:600}
.scen b{font-family:var(--font-mono);font-weight:500}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td select,td input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
td input[type=number]{width:80px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.meter .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.meter .t{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--tally)}

/* Command bar & proposals */
.cmd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmd label{font-size:12.5px;font-weight:600;color:var(--muted);flex-basis:100%}
.cmd input{flex:1 1 260px;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.cmd input:focus{border-color:var(--tally);outline:none;background:var(--surface)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.suggest button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.suggest button:hover{color:var(--ink);border-color:var(--muted)}
.pending{border:1px solid var(--tally);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.pending ul{margin:0;padding-left:18px;font-size:14px}
.pending li{margin-bottom:4px}
.delta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--font-mono);font-size:13px}

/* Production */
.phases{display:flex;flex-direction:column}
.phase{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0;padding-top:0}
.phase .w{font-family:var(--font-mono);font-size:12.5px;color:var(--tally)}
.phase ul{margin:0;padding-left:18px;font-size:14px}
@media (max-width:640px){.phase{grid-template-columns:1fr;gap:6px}}
.risk{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.risk:first-child{border-top:0}
.pill{font-size:11.5px;font-family:var(--font-mono);padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}

/* Sustainability */
.swap{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.swap.applied{border-color:var(--ok)}
.swap .d{display:flex;gap:14px;font-family:var(--font-mono);font-size:12.5px;flex-wrap:wrap}
.pos{color:var(--bad)} .neg{color:var(--ok)}

/* Export */
pre.md{white-space:pre-wrap;font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;max-height:520px;overflow:auto;margin:0}

/* Renders & visuals */
.render{position:relative;border-radius:8px;overflow:hidden;background:#05060c;max-width:100%}
.render canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.render .cap{position:absolute;left:10px;bottom:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:99px}
.render.big{border-radius:var(--r)}
.ros .act{min-width:200px}
.frames{display:flex;gap:6px;flex-wrap:wrap}
.frames button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.frames button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.palmini{display:flex;height:8px;border-radius:4px;overflow:hidden}
.palmini span{flex:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer}
.swatch input{width:52px;height:52px;border:1px solid var(--line);border-radius:10px;padding:0;background:none;cursor:pointer}
.head2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-top:12px}
.shot{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.shot img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:#05060c}
.shot figcaption{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.imgbtn{border:0;padding:0;background:none;cursor:zoom-in;display:block;width:100%}
.prompts{display:flex;flex-direction:column;gap:6px}
details.prompt{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface-2)}
details.prompt summary{cursor:pointer;font-weight:500;font-size:14px}

function scheduleSave() {

async function saveNow() {
  if (plan.example || !db) return;
  if (saving) { saveAgain = true; return; }
  saving = true; renderSaveState('saving');
  try { await db.doc('plans/' + plan.id).set(JSON.parse(JSON.stringify(plan))); lastSaved = Date.now(); saveError = null; }
  catch (e) { saveError = e?.code === 'quota_exceeded' ? 'Storage is full. Delete old plans to save.' : e?.code === 'invalid_argument' ? 'You can view plans but not save them.' : 'Not saved. Will retry on your next change.'; }
  finally { saving = false; renderSaveState(); if (saveAgain) { saveAgain = false; saveNow(); } }
}
function renderSaveState(s) {
  const el = $('#save-state'); if (!el) return;
  if (plan.example) el.textContent = 'Example plan · changes are not saved';
  else if (!db) el.textContent = 'Saved in this browser';
  else if (s === 'saving') el.textContent = 'Saving…';
  else if (s === 'pending') el.textContent = 'Unsaved changes';
  else if (saveError) el.textContent = saveError;
  else if (lastSaved) el.textContent = 'Saved to shared plans · ' + new Date(lastSaved).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  else el.textContent = 'Shared plans';

function subscribePlans() {

    b.venue = v.label; b.src.venue = { b: 'published', r: `Wikipedia: ${v.source.title}`, url: perm(v.source) };
    const placeSrc = { b: 'published', r: `Wikipedia: ${v.placeFrom.title}`, url: perm(v.placeFrom) };
    if (v.city && canFill(b, 'city')) { b.city = v.city; b.src.city = { ...placeSrc }; filled.push('city'); }
    if (v.country && canFill(b, 'country')) { b.country = /^(U\.S\.|US|USA)$/.test(v.country) ? 'United States' : v.country; b.src.country = { ...placeSrc }; filled.push('country'); }
    if (v.capacity && canFill(b, 'capacity')) { b.capacity = v.capacity; b.src.capacity = { b: 'published', r: `Wikipedia: ${v.source.title} (venue capacity)`, url: perm(v.source), cite: v.capacityCite || null }; filled.push('capacity'); }
    if (v.venueType && canFill(b, 'venueType')) { b.venueType = v.venueType; b.src.venueType = { b: 'published', r: `Venue of ${v.events.slice(0, 2).join(', ')}`, url: v.source.url }; filled.push('venue type'); }
    const c = fillCurrency(b); if (c) filled.push(c);
    if (localEmpty(p.local)) { const pk = findPack(b.city, b.venue); if (pk) { p.local = localFromPack(pk); filled.push('local profile'); } }
  }, { log: `Venue set to ${v.label}` });
  toast(filled.length ? `Filled ${filled.join(', ')} from published records. Each shows its source.` : `${v.label} chosen. Your own entries were kept.`);
}
function applyCountry(c) {

}
function applyCity(c) {

let sbCam = 'stage';
function storyboardPanel() {

  return `<section class="panel" style="display:flex;flex-direction:column;gap:14px"><div class="head2"><div><h2>Storyboard</h2><p class="note" style="margin-top:4px">${frames.length} frames through the ${total}-minute show. Each frame shows what has built up on the field by that moment. Add a cue note under any frame.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div class="frames" role="group" aria-label="Interval">${[[.5, 'Every 30 s'], [1, 'Every minute'], [2, 'Every 2 min']].map(([v, l]) => `<button data-act="sb-step" data-v="${v}" class="${stepM === v ? 'on' : ''}" aria-pressed="${stepM === v}">${l}</button>`).join('')}</div>
      <div class="frames" role="group" aria-label="Camera">${[['stage', 'Stage camera'], ['wide', 'Main camera']].map(([v, l]) => `<button data-act="sb-cam" data-v="${v}" class="${sbCam === v ? 'on' : ''}" aria-pressed="${sbCam === v}">${l}</button>`).join('')}</div>

    </div></div>
    <div class="sb">${frames.map(t => {
      const fr = storyFrame(plan, t + stepM * .8), els = plan.elements.filter(e => e.included && e.act === fr.act?.name);
      return `<figure class="sbf"><div class="render"><canvas data-render="sb:${t}" width="1280" height="720" role="img" aria-label="Storyboard frame at ${timecode(t)}"></canvas><span class="cap">${timecode(t)}</span></div>
        <figcaption><div><b>${esc(fr.act?.name || '')}</b> <span class="muted mono" style="font-size:12px">${Math.round(fr.prog * 100)}% through</span></div>
        <div class="note">${esc(els.map(e => e.name).join(' · ') || 'Holding from the previous act')}</div>
        <textarea data-cue="${t}" rows="2" aria-label="Cue note at ${timecode(t)}" placeholder="Cue note: camera, music, cast…">${esc(plan.cues?.[t] || '')}</textarea></figcaption></figure>`;
    }).join('')}</div></section>`;
}
async function exportStoryboard() {
  const cvs = [...document.querySelectorAll('canvas[data-render^="sb:"]')]; if (!cvs.length || !downloads) return;
  const cols = 4, fw = 640, fh = 360, pad = 64, rows = Math.ceil(cvs.length / cols);
  const sh = document.createElement('canvas'); sh.width = cols * fw + (cols + 1) * 16; sh.height = 90 + rows * (fh + pad);
  const x = sh.getContext('2d'); x.fillStyle = '#0b0d18'; x.fillRect(0, 0, sh.width, sh.height);
  x.fillStyle = '#ffffff'; x.font = '700 30px sans-serif'; x.fillText(plan.name + ' · storyboard', 16, 52);
  cvs.forEach((c, i) => {
    const t = +c.dataset.render.slice(3), fr = storyFrame(plan, t + (plan.sbStep || 1) * .8);
    const px = 16 + (i % cols) * (fw + 16), py = 80 + Math.floor(i / cols) * (fh + pad);
    x.drawImage(c, px, py, fw, fh); x.fillStyle = '#ffffff'; x.font = '600 20px monospace'; x.fillText(timecode(t) + '  ' + (fr.act?.name || ''), px, py + fh + 26);
    const cue = plan.cues?.[t]; if (cue) { x.fillStyle = '#aab'; x.font = '16px sans-serif'; x.fillText(String(cue).slice(0, 70), px, py + fh + 48); }
  });
  sh.toBlob(async b => { if (!b) return; try { await downloads.save({ filename: 'storyboard.png', data: b }); } catch (e) { if (e?.code !== 'declined') toast('Could not save the contact sheet.'); } }, 'image/png');
}

async function runReadReport(text, image) {
  const prompt = `You are a sustainability analyst for live events. Read this event emissions report and extract the emissions by category in tonnes of CO2e.
Map every line to exactly one of these categories: ${Object.entries(CARBON_CATS).map(([k, l]) => `${k} (${l})`).join(', ')}.
Convert kg to tonnes. Do not invent numbers; skip lines without a figure. Do not double count subtotals and scope totals.

Reply with ONLY JSON: {"label":"short name of the event and year","attendance":number or null,"total":number or null,"rows":[{"cat":"one of the keys","t":number,"raw":"the original line or label"}],"notes":"one sentence on anything uncertain"}
${text ? '\nREPORT:\n' + String(text).slice(0, 30000) : '\nThe report is in the attached image.'}`;
  if (!sample) { toast('Claude is not available in this view.'); return; }
  if (busy) { toast('Claude is still working on the last request.'); return; }
  const ctl = new AbortController(); busy = { label: 'Reading the report…', ctl, chars: 0 }; renderBusy();
  try {
    const r = await sample.json(prompt, { signal: ctl.signal, cache: false, ...(image ? { images: [image] } : {}), onText: ({ text }) => { if (busy) { busy.chars = text.length; renderBusy(); } } });
    const rows = arr(r.rows).filter(x => x && CARBON_CATS[x.cat] && Number.isFinite(+x.t)).map(x => ({ cat: x.cat, t: +x.t, raw: String(x.raw || CARBON_CATS[x.cat]) }));
    if (!rows.length) { toast('No emissions figures found in that report.'); return; }
    mutate(p => { p.prevReport = { label: String(r.label || 'Previous event'), attendance: num(r.attendance) || null, total: num(r.total) || null, rows, unmatched: r.notes ? [String(r.notes)] : [], source: 'claude' }; }, { log: 'Previous report read by Claude' });
    requestAnimationFrame(() => $('#compare')?.scrollIntoView({ block: 'start' }));
  } catch (e) { if (e?.code !== 'cancelled') toast(errCopy(e)); }
  finally { busy = null; renderBusy(); }
}

function vProduction() {
  const P = plan.production; const w = weeksUntil(plan.brief.date);
  const inc = plan.elements.filter(e => e.included);
  const LB = REFDATA?.['closeout-benchmarks']?.leadWeeks || [];
  const risks = inc.map(e => ({ e, lead: e.leadWeeks })).sort((a, b) => (b.lead ?? 1e9) - (a.lead ?? 1e9));
  const riskRows = risks.map(({ e, lead }) => {
    if (lead == null) { const bm = LB.find(x => x.category === e.category); return `<div class="risk"><span>${esc(e.name)} <span class="muted" style="font-size:12.5px">· lead time not confirmed${bm ? ` · your past ${esc(e.category).toLowerCase()} jobs: median ${bm.median} wk (n=${bm.n})` : ''}</span></span><button class="btn sm" data-act="edit" data-id="${e.id}">Add</button></div>`; }
    let pill = '<span class="pill ok">On track</span>';
    if (w != null) { const slack = w - lead; pill = slack < 0 ? `<span class="pill bad">${-slack} wk short</span>` : slack < 4 ? `<span class="pill warn">${slack} wk slack</span>` : `<span class="pill ok">${slack} wk slack</span>`; }
    return `<div class="risk"><span>${esc(e.name)} <span class="muted mono" style="font-size:12.5px">· ${lead} wk</span></span>${pill}</div>`;
  }).join('');
  const top = head('Production', `On-ground production and manufacturing for the elements you selected. ${w != null ? `<b class="mono">${w} weeks</b> until the event.` : 'Set a date in the brief to check lead times.'}`, claudeBtn('production', P ? 'Refresh production plan' : 'Plan production') + libBtn('lib-production', 'Use standard template'));
  const leadPanel = `<section class="panel"><h2>Lead times vs time left</h2>${inc.length ? riskRows : '<p class="muted">No elements selected.</p>'}</section>`;
  if (!P) return `${top}<div class="grid g2"><div class="empty"><h2>No production plan yet</h2><p>Claude maps the phases from creative lock to load-out for your exact show, suggests how each element is built and sourced, and flags the critical path. The standard template gives you the same structure without Claude.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${claudeBtn('production', 'Plan production')}${libBtn('lib-production', 'Use standard template')}</div></div>${leadPanel}</div>${vendorsPanel()}`;
  const line = (k, v) => v ? `<p><b style="color:var(--ink)">${k}:</b> ${esc(v)}</p>` : '';
  const notes = inc.map(e => { const n = P.elementNotes[e.id]; if (!n) return ''; return `<div class="item panel" style="padding:16px;display:flex;flex-direction:column;gap:4px"><h3>${esc(e.name)} <span class="chip">${TIER_LABEL[e.tier]}</span></h3>
    ${line('Build', n.fabrication)}${line('Suppliers', n.suppliers)}${line('Local sourcing', n.localSourcing)}${line('Ask vendors', n.askVendors)}${line('Risk', n.risks)}${line('Vendors', (plan.vendors || []).filter(v => v.elementId === e.id).map(v => v.name + ' (' + v.status.toLowerCase() + ')').join(', '))}</div>`; }).join('');
  const stale = inc.some(e => !P.elementNotes[e.id]);
  return `${top}
  ${stale ? `<div class="banner"><span>Some elements changed since this plan was made. Refresh it to cover them.</span></div>` : ''}
  <div class="grid g2">
    <section class="panel"><h2>Phases</h2><div class="phases">${P.phases.map(ph => `<div class="phase"><div><div class="w">${esc(ph.when)}</div><h3>${esc(ph.name)}</h3></div><ul>${ph.tasks.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div></section>

  if (el.dataset.src) { mutate(p => setSrc(p, el.dataset.src, el.dataset.k, el.dataset.k === 'r' ? el.value.trim() : el.value)); return; }
  if (el.dataset.line) { mutate(p => { const l = p.lines.find(x => x.id === el.dataset.line); if (!l) return; const k = el.dataset.k;
    if (k === 'oh') l.oh = el.checked;
    else if (k === 'cost') l.cost = el.value === '' ? null : Math.max(0, num(el.value));
    else if (k === 'co2v') { l.co2s ||= { v: '', b: '', r: '' }; l.co2s.v = el.value === '' ? '' : Math.max(0, num(el.value)); }
    else if (k === 'category') { const wasDefault = (l.co2m || 'spend') === defaultCo2Method(l.category); l.category = el.value; if (wasDefault) l.co2m = defaultCo2Method(el.value); }
    else l[k] = el.value; }); return; }
  if (el.dataset.carbon) { mutate(p => { p.carbon[el.dataset.carbon] = Math.max(0, num(el.value)); }); return; }
  if (el.dataset.factor) { mutate(p => { const o = p.carbon.factorOverrides[el.dataset.factor] ||= { v: '', b: '', r: '' }; o.v = el.value === '' ? '' : Math.max(0, num(el.value)); }); return; }
  if (el.dataset.seg != null) { mutate(p => { const sg = p.travel.segments[+el.dataset.seg]; if (!sg) return; const k = el.dataset.k; sg[k] = k === 'mode' ? el.value : Math.max(k === 'occ' ? 1 : 0, num(el.value)); if (k === 'pct') sg.pct = Math.min(100, sg.pct); }); return; }
  if (el.dataset.co) { mutate(p => { p.closeout ||= { attendance: '', els: {}, lines: {} }; const co = p.closeout; if (el.dataset.co === 'attendance') { co.attendance = el.value === '' ? '' : Math.max(0, num(el.value)); return; } const [kind, id] = el.dataset.co.split(':'); const bag = kind === 'el' ? co.els : co.lines; const r = bag[id] ||= {}; r[el.dataset.k] = el.dataset.k === 'ref' ? el.value.trim() : el.value === '' ? '' : Math.max(0, num(el.value)); }); return; }
  if (el.dataset.vendor) { mutate(p => { const v = p.vendors.find(x => x.id === el.dataset.vendor); if (v) v[el.dataset.k] = el.value; }); return; }
  if (el.dataset.prevrow != null) { mutate(p => { const r = p.prevReport.rows[+el.dataset.prevrow]; if (!r) return; if (el.dataset.k === 't') r.t = num(el.value); else r.cat = el.value; }); return; }
  if (el.dataset.prev) { mutate(p => { p.prevReport[el.dataset.prev] = el.dataset.prev === 'attendance' ? num(el.value) : el.value; }); return; }
  if (el.dataset.prevfile != null) { const f = el.files[0]; el.value = ''; if (!f) return; if (/^image\//.test(f.type)) { runReadReport('', f); return; } f.text().then(t => { const ta = $('#prev-text'); if (ta) ta.value = t; const r = parseReport(t); if (!r.rows.length) { toast('No categories with figures found in that file.' + (claudeState === 'off' ? '' : ' Try Read with Claude.')); return; } if (!r.label || r.label === 'Previous event') r.label = f.name.replace(/\.[a-z0-9]+$/i, ''); mutate(p => { p.prevReport = r; }, { log: 'Previous report compared' }); }).catch(() => toast('Could not read that file.')); return; }
  if (el.dataset.upload != null) { const files = [...el.files]; el.value = ''; uploadFiles(files, el.dataset.upload); return; }
  if (el.dataset.localmotif != null) { mutate(p => { p.local.motif = el.value; }); return; }
  if (el.dataset.motif != null) { mutate(p => { ensureLook(p).motif = el.value; }); return; }
  if (el.dataset.preset != null && el.value !== '') { mutate(p => { ensureLook(p).palette = [...PALETTES[+el.value].colors]; }); return; }
  if (el.dataset.pal) { mutate(() => {}); return; }
  if (el.dataset.oh) { mutate(p => { const o = p.overheads.find(x => x.id === el.dataset.oh); if (o) o[el.dataset.k] = el.dataset.k === 'pct' ? Math.max(0, num(el.value)) : el.value; }); return; }
  if (el.dataset.inc) { mutate(p => { const e = p.elements.find(x => x.id === el.dataset.inc); if (e) e.included = el.checked; }); return; }
  if (el.dataset.tiersel) { mutate(p => { const e = p.elements.find(x => x.id === el.dataset.tiersel); if (e) e.tier = el.value; }); return; }
}

/* ------------------------------------------------------------------ */
/* Boot                                                                */
/* ------------------------------------------------------------------ */
render();
loadReference();
(async () => {
  const c = window.claude;
  if (!c?.use) { claudeState = 'off'; downloads = browserDownloads; render(); return; }
  const [s, d, dl, as] = await Promise.all([c.use('sample').catch(() => null), c.use('db').catch(() => null), c.use('downloads').catch(() => null), c.use('assets').catch(() => null)]);
  sample = s; db = d; downloads = dl; assets = as;
  claudeState = sample ? 'ready' : 'off';
  if (db) { subscribePlans(); if (!plan.example) scheduleSave(); }
  render();
})();
</script>
